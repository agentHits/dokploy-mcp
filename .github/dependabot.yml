version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    target-branch: "AgentHits-Dev"
    schedule:
      interval: "weekly"
      day: "monday"
    # The owner takes only versions released at least 3 days ago.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major bumps are done by hand, one PR each.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
